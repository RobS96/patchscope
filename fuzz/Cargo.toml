[package]
name = "patchscope-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
patchscope-core = { path = "../patchscope-core" }

# A workspace of its own: the fuzz targets build only with nightly and
# cargo-fuzz, and stay out of the release build and its supply-chain gates.
[workspace]
members = ["."]

[[bin]]
name = "manager_output"
path = "fuzz_targets/manager_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "research_data"
path = "fuzz_targets/research_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_and_text"
path = "fuzz_targets/policy_and_text.rs"
test = false
doc = false
bench = false
