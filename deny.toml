# cargo-deny: advisories, bans, licenses, sources. CI runs `cargo deny check`
# on every push and pull request.

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0370/0371/0372 (informational "unmaintained", added to the db 2026-10-16):
# zvariant, zbus_names and zvariant_derive were merged into zbus 6.0.0 (released the same
# day). They arrive only via eframe -> egui-winit -> accesskit_winit -> accesskit_unix ->
# atspi -> zbus 5.19, the Linux AT-SPI accessibility bridge, so they are compiled into the
# Linux patchscope-gui build only (none on macOS or Windows). Not a vulnerability. No upstream fix
# yet: atspi 0.30.0 (latest) still requires zbus ^5.5. Drop these once eframe/accesskit move
# to zbus 6. Review by 2026-11-30.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6); Linux GUI build only, via atspi; no zbus-6 atspi release yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6); Linux GUI build only, via atspi; no zbus-6 atspi release yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); Linux GUI build only, via atspi; no zbus-6 atspi release yet" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0",  # the eframe/egui GUI stack
    "CDLA-Permissive-2.0",                     # webpki-root-certs (Mozilla's root list), via rustls-platform-verifier
    "MPL-2.0",                                 # file-level copyleft only; unmodified dependencies
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry versions, so `wildcards = "deny"` does
# not trip on them.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
