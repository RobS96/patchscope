# cargo-deny: advisories, bans, licenses, sources. CI runs `cargo deny check`
# on every push and pull request.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0",  # the eframe/egui GUI stack
    "CDLA-Permissive-2.0",                     # webpki-root-certs (Mozilla's root list), via rustls-platform-verifier
    "MPL-2.0",                                 # file-level copyleft only; unmodified dependencies
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry versions, so `wildcards = "deny"` does
# not trip on them.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
