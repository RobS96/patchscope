[workspace]
resolver = "2"
members = ["patchscope-core", "patchscope-cli", "patchscope-gui"]

[workspace.package]
version = "0.1.2"
edition = "2024"
# sysinfo 0.39 and eframe/egui 0.36 declare 1.95.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/RobS96/patchscope"
authors = ["RobS96"]

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
overflow-checks = true
