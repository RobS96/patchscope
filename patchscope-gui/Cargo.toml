[package]
name = "patchscope-gui"
description = "Desktop app for patchscope (Windows, macOS, Linux): scan, review findings, choose and install updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "patchscope-gui"
path = "src/main.rs"

[dependencies]
patchscope-core = { path = "../patchscope-core", version = "0.1.0" }
serde_json = "1"
directories = "6"
# glow, not wgpu: a 2D form-and-table UI needs no wgpu, and wgpu's D3D12
# backend has had windows-crate conflicts on Windows CI with eframe 0.36.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
