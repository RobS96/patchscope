version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version bumps wait until a release is a week old (a bad publish is
    # usually pulled within days). Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
