name: Advisories

# `cargo deny check advisories` on a schedule, not only when something is
# pushed: a RustSec advisory published against a dependency of a quiet
# repository is otherwise seen only through Dependabot's alerts, which cover
# vulnerabilities but not the unmaintained and unsound notices deny.toml
# also acts on. A failed run reaches the maintainer the way a failed CI run
# does.

on:
  schedule:
    - cron: "11 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Built from crates.io at the version ci.yml pins, so the two gates
      # agree on what they check.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.19.9

      - name: Advisories
        run: cargo deny check advisories
