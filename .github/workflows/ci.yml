name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One run per branch: a newer push to a pull request cancels the run the
# older push started. Runs on main and on tags are never cancelled, so
# every merge commit and every release gets its full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config

      # The runner's own rustup, as the MSRV job uses: no third-party action
      # stands between the checkout and the compiler.
      - name: Install the stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves a cache. A PR restores main's and does not save its
          # own: three OSes of per-branch caches ran the repo past GitHub's
          # 10 GB limit, which evicts the caches main needs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A release run (a pushed tag) neither restores nor saves: what a
          # tag's checks build comes from the locked tree alone, never from a
          # cache an earlier run wrote (zizmor's cache-poisoning audit).
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # Rustdoc warnings fail the build, private items included: a doc
      # link to an item that was renamed is what a reader of the source
      # hits first.
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

      # Spelling of source, docs and comments; _typos.toml lists the words
      # that are right as written. A prebuilt wheel pinned by sha256 in
      # .github/workflow-tools/requirements.txt, in a throwaway virtualenv.
      - name: Typos
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r .github/workflow-tools/requirements.txt
          "$RUNNER_TEMP/tools/bin/typos"

      - name: Build
        run: cargo build --locked --workspace --release

      # cargo-deny and cargo-vet check the whole dependency graph whatever
      # the host, so one matrix leg is enough. Both are built from crates.io
      # at pinned versions: a new release of either cannot change what the
      # gate checks without a change here, and no extra action is needed.
      - name: Install cargo-deny + cargo-vet
        if: matrix.os == 'ubuntu-latest'
        run: cargo install --locked cargo-deny@0.19.9 cargo-vet@0.10.2

      # The full check: deny.toml configures advisories, bans, licenses and
      # sources, and a narrower invocation would stop enforcing the rest.
      - name: Supply-chain advisories/bans/licenses/sources gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: Supply-chain provenance gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo vet check --locked

  # The versions Cargo.toml declares as the minimum must actually build.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config

      - name: Install the declared toolchain
        run: rustup toolchain install 1.95 --profile minimal

      - name: The workspace on 1.95
        run: cargo +1.95 check --locked --workspace --all-targets

  # One CycloneDX SBOM per crate and platform, shipped inside each archive.
  # Generated on every run rather than committed, so it always describes the
  # dependencies this build resolved. cargo-cyclonedx is not part of the
  # dependency set cargo-vet and cargo-deny gate, so it is built and run
  # here, in a job of its own that never sees the release binaries; the
  # package jobs only download its output. The SBOM for a target comes from
  # cargo's metadata and needs no compiler for that target.
  sbom:
    name: SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx@0.5.9
          # The macOS archive is a universal binary; its SBOM is the arm64
          # one, as it was when the macOS runner generated it natively.
          while read -r label target <&3; do
            cargo cyclonedx --format json --override-filename sbom --target "$target"
            mkdir -p "sbom/$label"
            for crate in patchscope-core patchscope-cli patchscope-gui; do
              mv "$crate/sbom.json" "sbom/$label/$crate.cdx.json"
              jq -e '.bomFormat == "CycloneDX"' "sbom/$label/$crate.cdx.json" >/dev/null
            done
          done 3<<'TARGETS'
          linux-x86_64 x86_64-unknown-linux-gnu
          linux-aarch64 aarch64-unknown-linux-gnu
          macos-universal aarch64-apple-darwin
          windows-x86_64 x86_64-pc-windows-msvc
          TARGETS
          ls -l sbom/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  # Builds exactly what a release ships, on every run, so a break in
  # packaging is found on the pull request and not after a tag is public.
  # Read-only token, and nothing runs here but the checkout, the toolchain
  # and cargo on the locked, vetted dependency tree. The runner images are
  # named, not "latest": the Linux image sets the oldest glibc the binaries
  # run on, and that should change in a commit, not when GitHub repoints a
  # label.
  package:
    name: Package (${{ matrix.label }})
    needs: sbom
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glibc the Linux binaries need is this image's (2.35),
          # so they run on Debian 12, Ubuntu 22.04+, Fedora and Arch.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: ubuntu-22.04-arm
            label: linux-aarch64
          - os: macos-26
            label: macos-universal
          - os: windows-2025
            label: windows-x86_64
    env:
      # A tag name on a release run; a placeholder otherwise.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config

      - name: Install the stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --locked --workspace --release

      - name: Build (universal binary)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --workspace --release --target x86_64-apple-darwin
          cargo build --locked --workspace --release --target aarch64-apple-darwin
          mkdir -p target/release
          for bin in patchscope patchscope-gui; do
            lipo -create \
              target/x86_64-apple-darwin/release/$bin \
              target/aarch64-apple-darwin/release/$bin \
              -output target/release/$bin
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom-all

      - name: Package
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p stage/sbom dist
          cp README.md LICENSE CHANGELOG.md stage/
          cp sbom-all/${{ matrix.label }}/*.cdx.json stage/sbom/
          test "$(find stage/sbom -type f | wc -l)" -eq 3
          # What built this archive, for anyone reproducing or auditing it.
          {
            echo "repository: $GITHUB_REPOSITORY"
            echo "ref: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "platform: $LABEL"
            echo "runner-image: ${ImageOS:-?} ${ImageVersion:-?}"
            rustc -vV | sed 's/^/rustc: /'
            echo "cargo: $(cargo -V)"
            if command -v sha256sum >/dev/null; then lock=$(sha256sum Cargo.lock); else lock=$(shasum -a 256 Cargo.lock); fi
            echo "Cargo.lock-sha256: ${lock%% *}"
          } > stage/BUILD-INFO.txt
          cat stage/BUILD-INFO.txt
          # The two binaries' SBOMs also become release files of their own,
          # under the release's naming, so a scanner can read them without
          # unpacking anything. They are listed in the checksums and covered
          # by the same attestation as the archive.
          for crate in patchscope-cli patchscope-gui; do
            cp "stage/sbom/$crate.cdx.json" "dist/patchscope-${VERSION}-${LABEL}-${crate}.cdx.json"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/patchscope.exe target/release/patchscope-gui.exe stage/
            7z a "dist/patchscope-${VERSION}-${{ matrix.label }}.zip" ./stage/*
          else
            cp target/release/patchscope target/release/patchscope-gui stage/
            tar -czf "dist/patchscope-${VERSION}-${{ matrix.label }}.tar.gz" -C stage .
          fi

      # Named per platform: all three end up in one release, and a shared
      # name would leave only one job's checksums.
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum patchscope-* > "SHA256SUMS-${{ matrix.label }}.txt"
          else
            shasum -a 256 patchscope-* > "SHA256SUMS-${{ matrix.label }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: The packaged CLI runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x dist/patchscope-*.zip -ounpacked >/dev/null
            bin=unpacked/patchscope.exe
          else
            tar -xzf dist/patchscope-*.tar.gz -C unpacked
            bin=unpacked/patchscope
          fi
          # A real inventory of this runner, offline: it must name the OS
          # and see a CPU and memory.
          "$bin" discover --manager npm-global --format json -o inventory.json
          jq -e '.os.name != "" and .hardware.cpu.logical_cores > 0 and .hardware.memory.total_bytes > 0' inventory.json

      # A release cannot be corrected once it is public (immutable releases,
      # protected tags), so what the archive says about itself is checked on
      # every run: the binary's version against the workspace version and
      # the two path dependencies, and on a release run the tag and the
      # changelog heading as well.
      - name: Versions agree
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$crate" ] || { echo "no workspace version in Cargo.toml"; exit 1; }
          bin=unpacked/patchscope
          if [ "$RUNNER_OS" = "Windows" ]; then bin=unpacked/patchscope.exe; fi
          reported=$("$bin" --version | tr -d '\r')
          [ "$reported" = "patchscope $crate" ] || { echo "the binary reports '$reported'; Cargo.toml says $crate"; exit 1; }
          for manifest in patchscope-cli/Cargo.toml patchscope-gui/Cargo.toml; do
            grep -q "^patchscope-core = { path = \"../patchscope-core\", version = \"$crate\" }" "$manifest" \
              || { echo "$manifest does not depend on patchscope-core $crate"; exit 1; }
          done
          if [ "$VERSION" != dev ]; then
            [ "$VERSION" = "v$crate" ] || { echo "tag $VERSION, crate version $crate"; exit 1; }
            grep -q "^## \[$crate\] - " CHANGELOG.md || { echo "CHANGELOG.md has no heading for $crate"; exit 1; }
          fi
          echo "patchscope $crate"

      # This version's CHANGELOG section becomes the release notes. Read
      # here, once: the publish job has no checkout, by design.
      - name: Release notes
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          awk -v heading="## [$crate] - " '
            index($0, heading) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { lines[++n] = $0 }
            END {
              while (n && lines[n] ~ /^[[:space:]]*$/) n--
              for (i = 1; i <= n; i++) print lines[i]
            }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            # A release run has already required the heading ("Versions
            # agree"); a dev build between a version bump and its changelog
            # entry has nothing to show yet.
            [ "$VERSION" = dev ] || { echo "CHANGELOG.md has no entry for $crate"; exit 1; }
            echo "(no CHANGELOG entry for $crate yet)" > release-notes.md
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.label == 'linux-x86_64'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The archives, run where they were not built: the x86_64 half of the
  # universal binary (the macOS package job runs on Apple silicon), a newer
  # glibc than the one built against, and an older Windows, and the aarch64 Linux archive on
  # an Arm runner.
  # Download, unpack, run. A release waits for these as well.
  smoke:
    name: Smoke (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-universal
          - os: ubuntu-26.04
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: windows-2022
            label: windows-x86_64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.label }}
          path: dist

      - name: The packaged CLI runs here too
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x dist/patchscope-*.zip -ounpacked >/dev/null
            bin=unpacked/patchscope.exe
          else
            tar -xzf dist/patchscope-*.tar.gz -C unpacked
            bin=unpacked/patchscope
          fi
          "$bin" --version
          # A real inventory of this runner, offline: it must name the OS
          # and see a CPU and memory.
          "$bin" discover --manager npm-global --format json -o inventory.json
          jq -e '.os.name != "" and .hardware.cpu.logical_cores > 0 and .hardware.memory.total_bytes > 0' inventory.json
          cat unpacked/BUILD-INFO.txt

  # Runs no code from the repository or its dependencies: it downloads what
  # the package jobs built, attests it and publishes. The write permissions
  # live only here. All three platforms must have built, and the release is
  # created as a draft and published once every file is attached, so there
  # is never a public release with files missing.
  # Developer ID signing and Apple notarisation of the macOS binaries, so
  # Gatekeeper opens them without a warning. Off until the repository
  # variable MACOS_SIGNING is "true" (see docs/code-signing.md); while off
  # this job is skipped and the release ships unsigned, as before. The
  # credentials live only in the "release-signing" environment, which a
  # maintainer approves for each release, and only this job can read them.
  # It runs nothing from the repository: it downloads the packaged archive,
  # signs, notarises, repackages and replaces it.
  sign-macos:
    name: Sign and notarise (macOS)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.MACOS_SIGNING == 'true'
    needs: package
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-signing
    env:
      LABEL: macos-universal
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-macos-universal
          path: dist

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 24)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          umask 077
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Sign
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir stage
          tar -xzf "dist/patchscope-${VERSION}-${LABEL}.tar.gz" -C stage
          for bin in patchscope patchscope-gui; do
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "stage/$bin"
            codesign --verify --strict --verbose=2 "stage/$bin"
          done

      - name: Notarise
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8" > "$key"
          ditto -c -k --keepParent stage/patchscope stage/notarise-cli.zip
          ditto -c -k --keepParent stage/patchscope-gui stage/notarise-gui.zip
          for z in stage/notarise-cli.zip stage/notarise-gui.zip; do
            xcrun notarytool submit "$z" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$z.json"
            jq -e '.status == "Accepted"' "$z.json" || { cat "$z.json"; exit 1; }
          done
          rm -f "$key" stage/notarise-*.zip stage/notarise-*.zip.json
          # A bare executable cannot have a ticket stapled; Gatekeeper
          # checks the notarisation online on first launch.
          for bin in patchscope patchscope-gui; do
            spctl --assess --type execute --verbose=2 "stage/$bin" || true
          done

      - name: Repackage and re-checksum
        run: |
          set -euo pipefail
          rm "dist/patchscope-${VERSION}-${LABEL}.tar.gz"
          tar -czf "dist/patchscope-${VERSION}-${LABEL}.tar.gz" -C stage .
          cd dist
          shasum -a 256 patchscope-* > "SHA256SUMS-${LABEL}.txt"
          cat "SHA256SUMS-${LABEL}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-universal
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  publish:
    name: Publish release
    # A pushed tag only: "Run workflow" on a tag would rebuild and attest
    # binaries that were never the released ones.
    # Signing is optional: a skipped sign-macos is fine, a failed one stops
    # the release (it fails closed rather than shipping half-signed).
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.test.result == 'success' && needs.msrv.result == 'success'
      && needs.package.result == 'success' && needs.smoke.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    needs: [test, msrv, package, smoke, sign-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # A release is cut only from a signed annotated tag that GitHub
      # verifies, on a commit already on main, so it has been through the
      # branch's required checks. Asked of the API: this job still runs
      # nothing from the repository.
      - name: Tag is signed and on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          [ "$(jq -r .object.type <<<"$ref")" = tag ] \
            || { echo "::error::$GITHUB_REF_NAME is a lightweight tag; a release needs a signed annotated one"; exit 1; }
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          [ "$(jq -r .verification.verified <<<"$tag")" = true ] \
            || { echo "::error::the tag's signature is not verified ($(jq -r .verification.reason <<<"$tag"))"; exit 1; }
          [ "$(jq -r .object.sha <<<"$tag")" = "$GITHUB_SHA" ] \
            || { echo "::error::the tag does not point at the commit this run built"; exit 1; }
          # "identical" or "behind": main contains the tagged commit.
          state=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$state" in
            identical|behind) echo "$GITHUB_REF_NAME: signed, verified, on main" ;;
            *) echo "::error::$GITHUB_SHA is not on main (compare status: $state)"; exit 1 ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: List release files
        # 4 archives, 4 checksum files and 8 SBOMs.
        run: ls -l dist && test "$(find dist -type f | wc -l)" -eq 16

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/patchscope-*

      # The same signed attestation, attached to the release as a Sigstore
      # bundle, so a download can be verified without GitHub's attestation
      # API (`gh attestation verify --bundle`) and tools that look for a
      # signature beside the files (OpenSSF Scorecard) find one.
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -se 'length == 1 and (.[0].mediaType | startswith("application/vnd.dev.sigstore.bundle"))' "$BUNDLE" >/dev/null \
            || { echo "::error::expected exactly one Sigstore bundle in $BUNDLE"; exit 1; }
          jq -c . "$BUNDLE" > "dist/patchscope-${GITHUB_REF_NAME}-provenance.sigstore.json"
          ls -l dist && test "$(find dist -type f | wc -l)" -eq 17

      - name: Create draft release, attach files, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The notes: this version's CHANGELOG section, then how to verify.
          {
            cat notes/release-notes.md
            echo
            echo "---"
            echo "Verify a download with the SHA256SUMS file for your platform and \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/ci.yml\` (add \`--bundle patchscope-${GITHUB_REF_NAME}-provenance.sigstore.json\` to use the attached attestation instead of fetching it). The \`*.cdx.json\` files are the CycloneDX SBOMs of the two binaries per platform, covered by the same attestation; \`BUILD-INFO.txt\` inside each archive records the commit, toolchain and runner image that built it."
          } > "$RUNNER_TEMP/notes.md"
          # A re-run after a failure part-way finds the draft and completes
          # it; a release that is already public is never touched.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::release $GITHUB_REF_NAME is already published"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" dist/*
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
